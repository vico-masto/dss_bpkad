services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: dss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: v1ckh0Masto04
      POSTGRES_DB: dss_bpkad
    ports:
      - "5432:5432"
    volumes:
      - pg_data_sp2d:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dss_bpkad"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis hanya untuk modul Verifikasi Masal (BullMQ). Tanpa port publik.
  redis:
    image: redis:7-alpine
    container_name: dss-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dss-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override DATABASE_URL agar backend reach postgres via service name, bukan localhost
      DATABASE_URL: postgresql://postgres:v1ckh0Masto04@postgres:5432/dss_bpkad?connection_limit=3&pool_timeout=20
      # Modul Verifikasi Masal: antrean via Redis
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # Worker verifikasi masal: proses terpisah agar event loop API tak terbebani.
  verification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dss-verification-worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:v1ckh0Masto04@postgres:5432/dss_bpkad?connection_limit=3&pool_timeout=20
      REDIS_URL: redis://redis:6379
    command: ["node", "workers/verificationWorker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUPPETEER_SKIP_DOWNLOAD: "true"
        # Dipakai next.config.js saat `next build` (rewrites ke backend)
        BACKEND_URL: "http://backend:5000"
    container_name: dss-frontend
    restart: unless-stopped
    environment:
      # Browser (client-side) tetap pakai localhost:5000 karena browser ada di host
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      # Next.js server-side (rewrites) pakai nama service Docker
      BACKEND_URL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pg_data_sp2d:
    external: true
